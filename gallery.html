<!DOCTYPE html>
<html lang="en">
<head>
  <script type="text/javascript" src="https://payhip.com/payhip.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ryknbel Gallery</title>
  <style>
    body {
      font-family: courier;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
        /* Hamburger icon */
    .menu-icon {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      cursor: pointer;
      width: 30px;
      height: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .menu-icon span {
      display: block;
      height: 4px;
      background: black;
      border-radius: 2px;
    }

    /* Fullscreen menu overlay */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(99, 87, 80, .75);
      color: white;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .menu-overlay a {
      color: white;
      font-size: 2em;
      text-decoration: none;
      margin: 15px 0;
    }
    .close-menu {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2em;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1400px;
      margin: auto;
    }

    .art-item {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }

    .art-item img {
      width: 100%;
      min-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }

    .art-title {
      font-size: 1.2em;
      font-weight: bold;
      margin: 15px 0 10px;
    }

    .stripe-link {
      display: inline-block;
      margin: 10px 0;
      padding: 10px 18px;
      background: #000;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .stripe-link:hover {
      background: #444;
    }

    .description {
      display: none;
      margin-top: 10px;
      font-size: 0.95em;
      line-height: 1.4;
      text-align: left;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #0077cc;
      cursor: pointer;
      font-size: 0.95em;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .gallery {
        padding: 20px;
        gap: 20px;
      }
    }
  </style>
</head>
<body>
<!-- Hamburger menu button -->
  <div class="hero-wrapper">
  <div class="menu-icon" onclick="toggleMenu(true)">
    <span></span>
    <span></span>
    <span></span>
  </div>
<div class="menu-overlay" id="menu">
  <div class="close-menu" onclick="toggleMenu(false)">✕</div>
  <a href="https://ryknbel.github.io/">main</a>
  <a href="https://open.spotify.com/artist/0HOBwf3NhPWTcZi8ie7T0W" target="_blank">spotify</a>
  <a href="https://www.youtube.com/channel/UCmwM8jGHyb6T6FqrOVHxNNw" target="_blank">youtube chevelle</a>
  <a href="https://ryknbel.com/gallery.html" target="_blank">drawings</a>
</div>
<div class="hero-wrapper">
  <div class="menu-icon" onclick="toggleMenu(true)">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <h1 style="text-align:center; padding:20px 0;">Rȳknbĕl Gallery</h1>

  <div class="gallery">

    <!-- Example Art Item -->
    <div class="art-item">
      <a href="https://ryknbel.com/IMG_4207.jpeg" target="_blank">
        <img src="https://ryknbel.com/IMG_4207.jpeg" alt="Artwork 1">
      </a>
      <div class="art-title">Face Fears</div>
      
      <button class="toggle-btn" onclick="toggleDescription(this)">more</button>
      <div class="description">
        This is an original 8x10, unfinished ink drawing. No repreductions will be made.
      </div>
      <a href="https://payhip.com/b/Q8ThP" class="payhip-buy-button" data-theme="grey" data-product="Q8ThP">ship it</a>
    </div>
  </div>

    <!-- Duplicate more .art-item blocks for additional artwork -->
  <div class="art-item">
      <a href="https://ryknbel.com/trucktown%20.heic" target="_blank">
        <img src="https://ryknbel.com/trucktown%20.heic" alt="Artwork 1">
      </a>
      <div class="art-title">Trucktown</div>
      
      <button class="toggle-btn" onclick="toggleDescription(this)">more</button>
      <div class="description">
        This is a little unfinished pencil drawing. Unavailable.
      </div>
    </div>

  <script>
    function toggleDescription(button) {
      const desc = button.nextElementSibling;
      if (desc.style.display === "block") {
        desc.style.display = "none";
        button.textContent = "more";
      } else {
        desc.style.display = "block";
        button.textContent = "less";
      }
    }
  </script>

</body>
</html>
